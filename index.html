<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Winter Day | برنامج الفعالية</title>
  <meta name="description" content="تطبيق The Winter Day: البرنامج والورش والبوثات – 17 ديسمبر | The Winter Day app: programme, workshops and booths – 17 December">
  <meta name="theme-color" content="#050E22">
  <link rel="icon" type="image/png" href="media/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="media/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Winter Day">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Winter Day">
  <meta property="og:description" content="يوم مفتوح بطابع شتوي · 17 ديسمبر – البرنامج والورش والبوثات">
  <meta property="og:image" content="https://bashaeraljohani.github.io/winter-day-programme/media/teaser-poster-ar.jpg">
  <meta property="og:url" content="https://bashaeraljohani.github.io/winter-day-programme/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Tajawal للنصوص، El Messiri للعناوين العربية، Cormorant Garamond لاسم الفعالية والأرقام -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- النصوص الثابتة تتبدّل حسب اللغة: data-i18n (النص) و data-i18n-aria -->
  <svg class="sprite" aria-hidden="true">
    <defs>
      <!-- رجل الثلج والتلال وأشجار الصنوبر (تُستخدم من app.js) -->
      <radialGradient id="sm-snow" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F1F7FD"/><stop offset="1" stop-color="#C5D9EE"/></radialGradient>
      <linearGradient id="hill-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C9BC8" stop-opacity=".55"/><stop offset="1" stop-color="#24406E" stop-opacity=".2"/></linearGradient>
      <linearGradient id="hill-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6E6F5"/><stop offset="1" stop-color="#8FAED4"/></linearGradient>
      <g id="pine">
        <path fill="#0D2A55" d="M0 -66 L-12 -44 H-6 L-18 -24 H-8 L-22 0 H22 L8 -24 H18 L6 -44 H12 Z"/>
        <path fill="#EAF3FC" d="M0 -66 L-7 -53 Q-3 -55 0 -52 Q3 -55 7 -53 Z M-12 -44 H12 L9.5 -41 Q4 -43 0 -40 Q-4 -43 -9.5 -41 Z M-18 -24 H18 L15 -21 Q7 -23 0 -20 Q-7 -23 -15 -21 Z"/>
      </g>
    </defs>
    <symbol id="flake" viewBox="-50 -50 100 100">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path id="arm" d="M0 -9V-46M-12 -39 0 -27 12 -39"/>
        <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/><use href="#arm" transform="rotate(180)"/>
        <use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/><circle r="9"/>
      </g>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.2-9.3C1.6 7.3 3.9 4 7.3 4c2 0 3.6 1.1 4.7 2.7C13.1 5.1 14.7 4 16.7 4c3.4 0 5.7 3.3 4.5 6.7C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12.5H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6 6 0 0 1 3.5 6"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4M8.2 13.2l7.6 4"/></symbol>
    <symbol id="i-cal-add" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.6L19.5 10l-5.7 1.5L12 17l-1.8-5.5L4.5 10l5.7-1.4zM19 16l.7 2.1 2.1.7-2.1.7L19 21.6l-.7-2.1-2.1-.7 2.1-.7z"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h5M14.5 16.5l1.5 1.5 3-3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5v8h14v-8M12 8.5v12M12 8.5S10.5 4 8 4.5 7 8.5 12 8.5zM12 8.5s1.5-4.5 4-4 1 4-4 4z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </svg>

  <!-- شاشة البداية (بعد الأيقونات عشان الندفة تنرسم كاملة) -->
  <div id="splash" aria-hidden="true">
    <svg><use href="#flake"/></svg>
    <span dir="ltr">The Winter Day</span>
  </div>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="The Winter Day"><svg aria-hidden="true"><use href="#flake"/></svg><span dir="ltr">The Winter Day</span></a>
    <nav class="top-nav" data-i18n-aria="navAria" aria-label="التنقل">
      <a href="#/" data-route="home" data-i18n="navHome">الرئيسية</a>
      <a href="#/programme" data-route="programme" data-i18n="navProgramme">البرنامج</a>
      <a href="#/booths" data-route="booths" data-i18n="navBooths">البوثات</a>
      <a href="#/favourites" data-route="favourites"><span data-i18n="navFavourites">المفضلة</span> <span class="fav-count" hidden></span></a>
      <a href="#/info" data-route="info" data-i18n="navInfo">معلومات</a>
    </nav>
    <button type="button" class="snow-btn" id="snow-btn" aria-pressed="false" aria-label="خلّيها تثلج"><svg aria-hidden="true"><use href="#flake"/></svg></button>
    <button type="button" class="lang-btn" id="lang-btn" lang="en" aria-label="Switch to English">EN</button>
  </header>

  <!-- ثلج خفيف فوق كل الصفحات (زر ❄ في الشريط العلوي) -->
  <canvas id="global-snow" aria-hidden="true"></canvas>

  <main id="view" tabindex="-1"></main>

  <footer class="footer"><span dir="ltr">Elevate Events · The Winter Day</span></footer>

  <nav class="tabbar" data-i18n-aria="navAria" aria-label="التنقل">
    <a href="#/" data-route="home"><svg aria-hidden="true"><use href="#i-home"/></svg><span data-i18n="navHome">الرئيسية</span></a>
    <a href="#/programme" data-route="programme"><svg aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="navProgramme">البرنامج</span></a>
    <a href="#/booths" data-route="booths"><svg aria-hidden="true"><use href="#i-bag"/></svg><span data-i18n="navBooths">البوثات</span></a>
    <a href="#/favourites" data-route="favourites"><svg aria-hidden="true"><use href="#i-heart"/></svg><span data-i18n="navFavourites">المفضلة</span><span class="fav-count" hidden></span></a>
    <a href="#/info" data-route="info"><svg aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="navInfo">معلومات</span></a>
  </nav>

  <!-- نافذة التفاصيل (فقرة أو منتج): محتواها يتعبّى من app.js -->
  <dialog id="sheet" class="sheet" aria-labelledby="sh-title">
    <form method="dialog" class="sh-close"><button class="icon-btn" data-i18n-aria="close" aria-label="إغلاق">×</button></form>
    <div id="sh-content"></div>
  </dialog>

  <!-- «اكتشفي يومك الشتوي» -->
  <dialog id="quiz" class="sheet quiz" aria-labelledby="quiz-title">
    <form method="dialog" class="sh-close"><button class="icon-btn" data-i18n-aria="close" aria-label="إغلاق">×</button></form>
    <div id="quiz-content"></div>
  </dialog>

  <!-- «بطاقتي الشتوية» -->
  <dialog id="maker" class="sheet maker" aria-labelledby="maker-title">
    <form method="dialog" class="sh-close"><button class="icon-btn" data-i18n-aria="close" aria-label="إغلاق">×</button></form>
    <div id="maker-content"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="art.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
